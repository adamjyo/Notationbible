# Clones candidate free Bible resources on GitHub's servers and commits a report of their
# layout, license and sample content (data/RESOURCES_REPORT.md). Nothing else is committed.
name: Inspect Bible resources
on:
  workflow_dispatch:
  push:
    branches: [claude/initial-reader]
    paths: ['.github/workflows/inspect-resources.yml']
permissions:
  contents: write
concurrency: { group: inspect, cancel-in-progress: true }
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/initial-reader }
      - name: Clone and report
        run: |
          set +e
          mkdir -p res && cd res
          R="SOTW-Historical-Commentaries/historical-commentary-resources Jackboby/MHCC-JSON thefrenchpressed/pillar-commentary-data garydavenport73/eastons-bible-dictionary-json neuu-org/bible-dictionary-dataset j86schroeder/topical-bible-search openbibleinfo/Bible-Geocoding-Data scrollmapper/bible_databases"
          {
          echo "# Resources report"; date -u
          for r in $R; do
            d=$(echo $r | tr / _)
            echo; echo "## $r"
            # tree only: no file contents are downloaded until a sample is read
            timeout 120 git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/$r.git $d || { echo "clone failed"; continue; }
            cd $d
            echo '```'; git ls-tree -r -l HEAD | awk '{print $4, $5}' | head -80; echo "... $(git ls-tree -r --name-only HEAD | wc -l) files"; echo '```'
            for L in $(git ls-tree -r --name-only HEAD | grep -iE '^(license|copying|readme)' | head -3); do echo "### $L"; timeout 60 git show HEAD:"$L" | head -c 1500; echo; done
            for f in $(git ls-tree -r --name-only HEAD | grep -iE '\.(json|jsonl|csv|tsv|txt)$' | grep -viE 'readme|license|package|\.github' | grep -iE "${PICK:-.}" | head -5); do
              echo "### sample $f"; echo '```'; timeout 60 git show HEAD:"$f" | head -c 700; echo; echo '```'
            done
            cd ..
          done
          } > ../data/RESOURCES_REPORT.md 2>&1
          wc -c ../data/RESOURCES_REPORT.md
      - name: Commit report
        run: |
          git config user.name "notationbible-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/RESOURCES_REPORT.md && git commit -q -m "Resources report from inspect-resources workflow" && git push || echo "nothing to commit"
