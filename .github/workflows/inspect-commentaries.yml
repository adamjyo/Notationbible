# Downloads the candidate SWORD modules on GitHub's servers, probes them with scripts/sword.py
# and commits a report (docs/COMMENTARY_SOURCES_REPORT.md): entries, sizes, raw samples.
name: Inspect commentary sources
on:
  workflow_dispatch:
  push:
    branches: [claude/initial-reader]
    paths: ['.github/workflows/inspect-commentaries.yml', 'scripts/probe_modules.py']
permissions:
  contents: write
concurrency: { group: inspect-commentaries, cancel-in-progress: true }
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/initial-reader }
      - name: Probe
        run: |
          set +e
          mkdir -p /tmp/m && cd /tmp/m
          UA='Mozilla/5.0 (compatible; NotationBibleImporter/1.0)'
          OUT=$GITHUB_WORKSPACE/docs/COMMENTARY_SOURCES_REPORT.md
          {
          echo "# Commentary sources report (probe)"; date -u
          for m in TDavid SME; do curl -sSfL -A "$UA" -o $m.zip https://www.crosswire.org/ftpmirror/pub/sword/packages/rawzip/$m.zip; done
          echo; echo "## SermonIndex pages: download links"
          for s in poole pulpit-commentary ellicott maclaren; do
            curl -sSL -A "$UA" "https://www.sermonindex.net/commentary/$s/" -o page_$s.html
            echo "### $s ($(stat -c %s page_$s.html) bytes)"
            grep -oiE '(href|src)="[^"]*(sword|\.zip|download)[^"]*"' page_$s.html | sort -u | head -20
            grep -oiE '.{0,120}(sword module|download).{0,160}' page_$s.html | head -6
          done
          echo; echo "## SermonIndex module zips"
          for s in poole pulpit-commentary ellicott maclaren; do
            link=$(grep -oiE 'https?://[^"]*modules/sword/[^"]+\.zip|/modules/sword/[^"]+\.zip' page_$s.html | head -1)
            names="$link sipoole poole sipulpit pulpit sipulpitcommentary siellicott ellicott simaclaren maclaren"
            for n in $names; do
              case "$n" in http*) u="$n";; /*) u="https://www.sermonindex.net$n";; *) u="https://www.sermonindex.net/modules/sword/$n.zip";; esac
              code=$(curl -s -o si_$s.zip -w '%{http_code}' -A "$UA" "$u")
              if [ "$code" = 200 ] && unzip -tq si_$s.zip >/dev/null 2>&1; then echo "$s -> $u ($(stat -c %s si_$s.zip) bytes)"; break; else echo "$s: $u -> $code"; rm -f si_$s.zip; fi
            done
          done
          echo; echo "## Probes"
          python3 $GITHUB_WORKSPACE/scripts/probe_modules.py $GITHUB_WORKSPACE/data/tr/kjv.json *.zip
          } > "$OUT" 2>&1
          wc -c "$OUT"
      - name: Commit report
        run: |
          git config user.name "notationbible-bot"; git config user.email "actions@users.noreply.github.com"
          git add docs/COMMENTARY_SOURCES_REPORT.md && git commit -q -m "Commentary sources probe report" && git push || echo "nothing to commit"
